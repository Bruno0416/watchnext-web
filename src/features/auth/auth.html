<section class="auth-view" aria-labelledby="auth-title">
  <div id="auth-welcome" class="auth-panel">
    <h1 id="auth-title" class="auth-title">Bienvenido a WatchNext</h1>

    <p class="auth-description">
      Inicia sesión para guardar tu actividad o continúa explorando sin una cuenta.
    </p>

    <div class="auth-actions">
      <button class="btn btn-primary auth-button" type="button" data-auth-view="login">
        Iniciar sesión
      </button>

      <button class="btn btn-outline-secondary auth-button" type="button" data-auth-view="register">
        Crear cuenta
      </button>

      <a class="auth-skip" href="#home" data-app-route="home">
        Continuar sin cuenta
      </a>
    </div>
  </div>

  <div id="auth-content" class="auth-content"></div>
</section>
