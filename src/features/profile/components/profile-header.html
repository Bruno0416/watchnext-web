<header class="profile-header">
  <div class="profile-avatar-wrap">
    <div id="profile-avatar" class="profile-avatar" aria-label="Avatar del perfil">
      <span id="profile-avatar-fallback">U</span>
    </div>
  </div>

  <div class="profile-identity">
    <div class="profile-name-row">
      <div>
        <h1 id="profile-display-name" class="profile-display-name">Usuario</h1>
        <p class="profile-username mb-0">
          @<span id="profile-username">usuario</span>
        </p>
      </div>

      <div class="profile-actions">
        <button
          id="profile-edit-button"
          class="btn btn-primary"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#profile-edit-panel"
          aria-controls="profile-edit-panel"
          aria-expanded="false"
        >
          <i class="bi bi-pencil me-1" aria-hidden="true"></i>
          Editar perfil
        </button>

        <button id="profile-follow-button" class="btn btn-primary" type="button" hidden>
          Seguir
        </button>
      </div>
    </div>

    <div class="profile-social-stats" aria-label="Estadísticas sociales">
      <div class="profile-social-stat">
        <strong id="stat-following">0</strong>
        <span>Siguiendo</span>
      </div>

      <div class="profile-social-stat">
        <strong id="stat-followers">0</strong>
        <span>Seguidores</span>
      </div>
    </div>

    <p id="profile-bio" class="profile-bio mb-0"></p>
  </div>
</header>
